# FocusIR Workbench 正式发布流水线（Windows x64 / .NET 10）。
# Gitee 导入后必须在任务界面绑定 Windows 主机组、PowerShell 脚本类型及代码源授权。
# 构建机需安装 Git、PowerShell 7、.NET 10 SDK，并能访问 Gitee 和 NuGet。
# 机密环境变量：UPDATE_SIGNING_KEY_PKCS8（PKCS#8 Base64 私钥，禁止写入本文件）。
# 手动运行时选择 vX.Y.Z 标签；确认 GITEE_BRANCH 解析为标签名，且代码检出标签提交。
# 使用完整 Git 历史，必须可访问 origin/master 和标签。
# 初次配置采用手动触发；在 Gitee UI 中可改为标签推送，正则 ^v\d+\.\d+\.\d+$。
# 同一仓库只启用一条正式 Release 流水线，避免与 .gitee/release-pipeline.yml 重复发版。
version: "1.0"
name: focusir-workbench-release-workflow
displayName: FocusIR 工作台正式发布

triggers:
  trigger: manual

stages:
  - name: build-and-sign
    displayName: Windows 构建、测试与签名打包
    strategy: naturally
    trigger: auto
    steps:
      - step: shell@agent
        name: build-release-package
        displayName: 生成 win-x64 正式升级包
        gitClone: "true"
        # 在 Gitee 任务界面选择实际 Windows 主机组后保存此字段。
        hostGroupID:
          ID: ""
        # 本段为 PowerShell 脚本；主机脚本类型需在 Gitee UI 明确选择。
        script: |-
          $ErrorActionPreference = 'Stop'
          if ([Environment]::OSVersion.Platform -ne [PlatformID]::Win32NT) {
              throw 'FocusIR 正式发布必须在 Windows x64 主机运行。'
          }
          if (-not [Environment]::Is64BitOperatingSystem) {
              throw 'FocusIR 正式发布需要 64 位 Windows。'
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY_PKCS8)) {
              throw '请为发布任务注入加密环境变量 UPDATE_SIGNING_KEY_PKCS8。'
          }
          # release.ps1 已包含完整 CI、标签/版本校验、发布、签名与成品检查。
          # 不重复执行 CI，不跳过工作区、远端 Release 或签名校验。
          pwsh -NoProfile -File .\eng\release.ps1 -Tag "${GITEE_BRANCH}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # 主机任务必须实际上传这些文件；下游不可直接读取 Windows 主机磁盘。
        artifacts:
          - name: FOCUSIR_RELEASE
            path:
              - artifacts/release/**
          - name: FOCUSIR_RELEASE_DIAGNOSTICS
            path:
              - artifacts/test-results/**
              - artifacts/build/**
        notify: []
        strategy:
          retry: "0"

  - name: publish-gitee
    displayName: 上传 Gitee 正式 Release
    strategy: naturally
    trigger: auto
    steps:
      - step: release@gitee
        name: publish-stable-release
        displayName: 发布升级包、清单、签名与校验文件
        releaseName: FocusIR Workbench ${GITEE_BRANCH}
        description: CHANGELOG.md
        tagName: ${GITEE_BRANCH}
        # 确认上游制品在当前插件工作区恢复为 artifacts/release 下的相对路径。
        upstreamArtifact:
          - FOCUSIR_RELEASE
        assertFiles:
          - artifacts/release/FocusIR.Workbench-${GITEE_BRANCH}-win-x64.zip
          - artifacts/release/update-manifest.json
          - artifacts/release/update-manifest.sig
          - artifacts/release/SHA256SUMS.txt
        prerelease: false
        allowUpdate: false
        notify: []
        strategy:
          retry: "0"

notify: []
strategy:
  blocking: true
