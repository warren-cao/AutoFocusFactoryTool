name: FocusIR Finalize Existing Release

# Recovery only: reuse the original signed artifact. Never rebuild a published version.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing source tag, e.g. v0.2.0'
        required: true
        type: string
      source_run_id:
        description: 'Original build run ID (this failure: 38519225911)'
        required: true
        type: string
      gitee_release_id:
        description: 'Existing Release ID (1204616); bridge only: 0 creates a missing bridge from original files'
        required: true
        type: string
      gitee_repository:
        description: 'Select the repository containing the existing release'
        required: true
        default: warren-cao/auto-focus-factory-tool
        type: choice
        options:
          - warren-cao/auto-focus-factory-tool
          - warren-cao/focusir-workbench-releases
      artifact_kind:
        description: 'Original main release or separately signed legacy bridge'
        required: true
        default: release
        type: choice
        options:
          - release
          - bridge
      github_release_id:
        description: 'Existing GitHub draft ID to resume; 0 requires no existing GitHub release'
        required: true
        default: '0'
        type: string
      github_failed_asset_id:
        description: 'Only an explicitly inspected failed ZIP starter asset ID may be discarded; 0 keeps everything'
        required: true
        default: '0'
        type: string
      use_local_backup:
        description: 'Use the verified original run backup on DESKTOP-AI3E9IB instead of downloading again'
        required: true
        default: false
        type: boolean
      publish:
        description: 'Finalize Gitee and publish GitHub (false = original artifact validation only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: focusir-stable-release
  cancel-in-progress: false

jobs:
  finalize:
    name: Recover the original signed release on DESKTOP-AI3E9IB
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      GITEE_RELEASE_ID: ${{ inputs.gitee_release_id }}
      PUBLISH_RELEASE: ${{ inputs.publish }}
      RELEASE_TOOLING_COMMIT: ${{ github.workflow_sha }}
      GITEE_REPOSITORY: ${{ inputs.gitee_repository }}
      ARTIFACT_KIND: ${{ inputs.artifact_kind }}
      EXISTING_GITHUB_RELEASE_ID: ${{ inputs.github_release_id }}
      FAILED_GITHUB_ASSET_ID: ${{ inputs.github_failed_asset_id }}
      USE_LOCAL_BACKUP: ${{ inputs.use_local_backup }}
      RECOVERY_SOURCE_DIRECTORY: ${{ github.workspace }}

    steps:
      - name: Validate trusted recovery request
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/master' -or $env:RUNNER_NAME -ine 'DESKTOP-AI3E9IB') { throw 'Use master on the trusted runner.' }
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Invalid stable tag.' }
          if ($env:GITEE_REPOSITORY -notin @('warren-cao/auto-focus-factory-tool', 'warren-cao/focusir-workbench-releases') -or
              $env:ARTIFACT_KIND -notin @('release', 'bridge')) { throw 'Unknown repository or artifact kind.' }
          if ($env:SOURCE_RUN_ID -cnotmatch '^[1-9]\d{0,17}$' -or $env:GITEE_RELEASE_ID -cnotmatch '^(0|[1-9]\d{0,17})$') { throw 'Invalid run or release ID.' }
          if ($env:EXISTING_GITHUB_RELEASE_ID -cnotmatch '^(0|[1-9]\d{0,17})$') { throw 'Invalid GitHub release ID.' }
          if ($env:FAILED_GITHUB_ASSET_ID -cnotmatch '^(0|[1-9]\d{0,17})$') { throw 'Invalid failed upload asset ID.' }
          if ($env:GITEE_RELEASE_ID -eq '0' -and $env:ARTIFACT_KIND -ne 'bridge') { throw 'Only an explicitly selected missing bridge may use Release ID 0.' }
          if ($env:ARTIFACT_KIND -eq 'bridge' -and ($env:RELEASE_TAG -cne 'v0.2.1' -or $env:GITEE_REPOSITORY -cne 'warren-cao/auto-focus-factory-tool')) { throw 'The migration bridge must target the legacy repository at v0.2.1.' }

      - name: Checkout original source tag and complete history
        if: env.USE_LOCAL_BACKUP != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the remote tag and clone the trusted local source cache
        if: env.USE_LOCAL_BACKUP == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = 'F:/Project/auto-focus-factory-tool'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'FocusIR-Recovery' }
          $root = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          try {
            $ref = Invoke-RestMethod -Uri "$root/git/ref/tags/$env:RELEASE_TAG" -Headers $headers -TimeoutSec 60
            $target = $ref.object
            for ($depth = 0; $target.type -eq 'tag' -and $depth -lt 5; $depth++) {
              $tag = Invoke-RestMethod -Uri "$root/git/tags/$($target.sha)" -Headers $headers -TimeoutSec 60
              $target = $tag.object
            }
            if ($target.type -cne 'commit' -or $target.sha -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid source tag target.' }
          } catch { throw 'Unable to independently verify the source tag through GitHub API.' }
          $localTag = @(git -C $source rev-parse "refs/tags/$env:RELEASE_TAG^{}")
          if ($LASTEXITCODE -ne 0 -or ($localTag -join '').Trim() -cne $target.sha) { throw 'Local source tag differs from GitHub; do not use this cache.' }
          git -C $source cat-file -e "$env:RELEASE_TOOLING_COMMIT^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Local cache lacks the caller workflow commit; sync the source cache or use normal checkout.' }
          $destination = Join-Path $env:RUNNER_TEMP "focusir-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $destination) { throw 'Dedicated recovery source already exists; refusing to overwrite.' }
          git clone --no-hardlinks --no-checkout $source $destination
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create an independent recovery source clone.' }
          git -C $destination fsck --full --no-reflogs
          if ($LASTEXITCODE -ne 0) { throw 'Recovery Git objects failed integrity verification.' }
          git -C $destination checkout --detach $target.sha
          if ($LASTEXITCODE -ne 0) { throw 'Unable to select the exact verified source commit.' }
          git -C $destination update-ref refs/remotes/origin/master $env:RELEASE_TOOLING_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Unable to pin the trusted workflow source reference.' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "RECOVERY_SOURCE_DIRECTORY=$destination`n", [Text.UTF8Encoding]::new($false))
          Write-Host "Source tag verified against GitHub and selected at $($target.sha); source cache and installed application were not modified."

      - name: Load trusted upload tooling
        run: |
          Set-Location -LiteralPath $env:RECOVERY_SOURCE_DIRECTORY
          git merge-base --is-ancestor HEAD refs/remotes/origin/master
          if ($LASTEXITCODE -ne 0) { throw 'Source tag must belong to master.' }
          $toolingDirectory = Join-Path $env:RUNNER_TEMP "focusir-recovery-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $null = [IO.Directory]::CreateDirectory($toolingDirectory)
          foreach ($name in @('Publish-GiteeRelease.ps1', 'Publish-GitHubRelease.ps1')) {
            $source = @(git show ('{0}:eng/{1}' -f $env:RELEASE_TOOLING_COMMIT, $name))
            if ($LASTEXITCODE -ne 0) { throw 'Unable to load trusted upload tooling.' }
            [IO.File]::WriteAllText((Join-Path $toolingDirectory $name), ($source -join "`n"), [Text.UTF8Encoding]::new($false))
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "FOCUSIR_TOOLING=$toolingDirectory`n", [Text.UTF8Encoding]::new($false))

      - name: Select original artifact from trusted build
        id: original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'FocusIR-Recovery' }
          $root = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions"
          try {
            $run = Invoke-RestMethod -Uri "$root/runs/$env:SOURCE_RUN_ID" -Headers $headers -TimeoutSec 60
            if ($run.head_repository.full_name -cne $env:GITHUB_REPOSITORY -or $run.status -cne 'completed' -or
                $run.event -notin @('push', 'workflow_dispatch') -or
                $run.path -notin @('.github/workflows/release.yml', '.github/workflows/release-self-hosted.yml')) {
              throw 'Source run is not a trusted completed build.'
            }
            $artifacts = Invoke-RestMethod -Uri "$root/runs/$env:SOURCE_RUN_ID/artifacts?per_page=100" -Headers $headers -TimeoutSec 60
            $names = @("focusir-$env:ARTIFACT_KIND-$env:RELEASE_TAG-$($run.run_attempt)", "focusir-self-hosted-$env:ARTIFACT_KIND-$env:RELEASE_TAG-$($run.run_attempt)")
            $selected = @($artifacts.artifacts | Where-Object { $_.name -cin $names -and -not $_.expired })
            if ($selected.Count -ne 1) { throw 'Exactly one original, unexpired signed artifact is required.' }
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "artifact_id=$($selected[0].id)`n", [Text.UTF8Encoding]::new($false))
          } catch { throw 'Unable to verify original artifact provenance. Do not rebuild or substitute another artifact.' }

      - name: Download the original immutable artifact
        if: env.USE_LOCAL_BACKUP != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.original.outputs.artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.RECOVERY_SOURCE_DIRECTORY }}/artifacts/recovery
          merge-multiple: true
          digest-mismatch: error

      - name: Copy the explicitly selected original run backup
        if: env.USE_LOCAL_BACKUP == 'true'
        run: |
          # Only the fixed project backup root and validated tag/run/kind can be selected.
          # No arbitrary path input, private key or credential is read here.
          $part = if ($env:ARTIFACT_KIND -eq 'bridge') { 'bridge-release' } else { 'release' }
          $runDirectory = "migration-$env:RELEASE_TAG-$env:SOURCE_RUN_ID"
          $source = Join-Path 'F:/Project/auto-focus-factory-tool/artifacts' "$runDirectory/$part"
          $destination = Join-Path $env:RECOVERY_SOURCE_DIRECTORY 'artifacts/recovery'
          if (-not (Test-Path -LiteralPath $source -PathType Container)) { throw 'Original local backup is unavailable; use the immutable GitHub artifact instead.' }
          if (Test-Path -LiteralPath $destination) { throw 'Recovery directory already exists; refusing to overwrite.' }
          $null = [IO.Directory]::CreateDirectory($destination)
          foreach ($name in @("FocusIR.Workbench-$env:RELEASE_TAG-win-x64.zip", 'update-manifest.json', 'update-manifest.sig', 'SHA256SUMS.txt')) {
            Copy-Item -LiteralPath (Join-Path $source $name) -Destination (Join-Path $destination $name)
          }

      - name: Verify original signature and exact remote files
        run: |
          $files = Join-Path $env:RECOVERY_SOURCE_DIRECTORY 'artifacts/recovery'
          if ($env:GITEE_RELEASE_ID -eq '0') {
            & "$env:FOCUSIR_TOOLING/Publish-GiteeRelease.ps1" -Tag $env:RELEASE_TAG -Mode Validate -SourceDirectory $env:RECOVERY_SOURCE_DIRECTORY -ArtifactDirectory $files
            & "$env:FOCUSIR_TOOLING/Publish-GiteeRelease.ps1" -Tag $env:RELEASE_TAG -Mode Diagnose -SourceDirectory $env:RECOVERY_SOURCE_DIRECTORY
          } else {
            & "$env:FOCUSIR_TOOLING/Publish-GiteeRelease.ps1" -Tag $env:RELEASE_TAG -Mode VerifyExisting -ReleaseId $env:GITEE_RELEASE_ID -SourceDirectory $env:RECOVERY_SOURCE_DIRECTORY -ArtifactDirectory $files
          }

      - name: Require the new feed and primary GitHub backup before recovering a bridge
        if: env.ARTIFACT_KIND == 'bridge'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          try {
            $newRelease = Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/warren-cao/focusir-workbench-releases/releases/tags/$env:RELEASE_TAG" -TimeoutSec 60
            if ($newRelease.tag_name -cne $env:RELEASE_TAG -or [string]$newRelease.prerelease -ine 'false') { throw 'New feed is not ready.' }
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'FocusIR-Recovery' }
            $backup = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" -Headers $headers -TimeoutSec 60
            if ($backup.tag_name -cne $env:RELEASE_TAG -or $backup.draft -or $backup.prerelease) { throw 'Primary backup is not ready.' }
          } catch { throw 'Complete the new Gitee feed and primary GitHub release first. Legacy clients must not migrate into an unready feed.' }

      - name: Verify remote bytes and finalize the same Gitee release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $files = Join-Path $env:RECOVERY_SOURCE_DIRECTORY 'artifacts/recovery'
          if ($env:GITEE_RELEASE_ID -eq '0') {
            & "$env:FOCUSIR_TOOLING/Publish-GiteeRelease.ps1" -Tag $env:RELEASE_TAG -SourceDirectory $env:RECOVERY_SOURCE_DIRECTORY -ArtifactDirectory $files
          } else {
            & "$env:FOCUSIR_TOOLING/Publish-GiteeRelease.ps1" -Tag $env:RELEASE_TAG -Mode FinalizeExisting -ReleaseId $env:GITEE_RELEASE_ID -SourceDirectory $env:RECOVERY_SOURCE_DIRECTORY -ArtifactDirectory $files
          }

      - name: Publish the identical original files to GitHub
        if: env.PUBLISH_RELEASE == 'true' && env.ARTIFACT_KIND == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Join-Path $env:RECOVERY_SOURCE_DIRECTORY 'artifacts/recovery'
          & "$env:FOCUSIR_TOOLING/Publish-GitHubRelease.ps1" -Tag $env:RELEASE_TAG -ExistingReleaseId $env:EXISTING_GITHUB_RELEASE_ID -FailedUploadAssetId $env:FAILED_GITHUB_ASSET_ID -SourceDirectory $env:RECOVERY_SOURCE_DIRECTORY -ArtifactDirectory $files

      - name: Preserve recovery diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focusir-finalize-diagnostics-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          path: ${{ env.RECOVERY_SOURCE_DIRECTORY }}/artifacts/release-logs/**
          if-no-files-found: ignore
          retention-days: 14
